name: Release Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Quality gate
        run: |
          ruff check .
          mypy src
          pytest --cov=project2_app --cov-fail-under=75

      - name: Build distributable ZIP
        run: |
          mkdir -p dist/data_analytics_course
          rsync -av --exclude '.git' --exclude '.venv' --exclude '.pytest_cache' --exclude '.mypy_cache' --exclude '.ruff_cache' --exclude '__pycache__' --exclude 'dist' --exclude '*.zip' ./ dist/data_analytics_course/
          cd dist
          zip -r data_analytics_course.zip data_analytics_course

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/data_analytics_course.zip --generate-notes --title "${GITHUB_REF_NAME}"
