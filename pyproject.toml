[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "is665-project2-model-comparison"
version = "1.2.0"
description = "Professional-grade Streamlit application for IS 665 Project 2 supervised classification comparison."
readme = "README.md"
requires-python = ">=3.11,<3.16"
authors = [{name = "IS 665 Group 1"}]
dependencies = [
  "streamlit==1.66.1",
  "scikit-learn==1.9.1",
  "pandas==3.1.1",
  "numpy==2.5.4",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.12,<1.0",
  "mypy>=1.15,<3.0",
  "pandas-stubs>=3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.15"
packages = ["project2_app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
